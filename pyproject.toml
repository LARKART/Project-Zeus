[project]
name = "zeus"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "croniter==6.2.4",
    "sounddevice==0.5.5",
    "openwakeword==0.6.0",
    "onnxruntime==1.19.2",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "av==18.0.0",
    "numpy==2.5.1",
    "pyobjc-framework-quartz==12.2.1",
]

[project.scripts]
zeus = "zeus.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
